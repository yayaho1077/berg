<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>북부대공 | 인물</title><meta name="description" content="일곱 명의 북부대공, 그들의 이야기와 테마곡."><link rel="stylesheet" href="style.css"></head><body>
<main id="gallery" aria-label="북부대공 인물 선택"></main>
<div class="mobile-guide"><span>옆으로 넘겨 인물을 선택하세요</span><span id="counter">01 / 07</span></div>
<section id="detail" hidden aria-label="인물 소개"><div class="detail-art" id="detailArt"></div><a class="back" href="#">← 인물 목록</a><div class="detail-content"><span class="eyebrow" id="detailIndex"></span><h1 id="detailName"></h1><div class="rule"></div><details class="inner-thought secret-dialogue" id="innerThought"><summary class="intro" id="characterIntro"></summary><p id="thoughtText"></p></details><div class="music"><span class="eyebrow">CHARACTER THEME</span><h2>그의 테마곡</h2><div id="characterTracks"></div><p id="musicStatus">전체 재생목록에서 음악을 감상하세요</p></div><nav class="character-nav" aria-label="다른 인물"><a id="prev"></a><a id="next"></a></nav></div></section>
<button id="playlistToggle" class="playlist-toggle" aria-controls="playlistPanel" aria-expanded="false">♫ 테마곡 전체 듣기</button>
<div id="playlistShade" class="playlist-shade" hidden></div><aside id="playlistPanel" class="playlist-panel" aria-label="전체 재생목록" hidden><div class="playlist-heading"><div><span class="eyebrow">THE NORTH · SOUNDTRACK</span><h2>테마곡 전체 듣기</h2></div><button id="playlistClose" aria-label="재생목록 닫기">✕</button></div><button id="playAll" class="play-all">▶ 전체 재생 · 10곡</button><ol id="trackList"></ol><p id="playbackMessage" role="status"></p></aside>
<div id="miniPlayer" class="mini-player" hidden><button id="miniPrev" aria-label="이전 곡">⏮</button><button id="miniPlay" aria-label="재생">▶</button><button id="miniNext" aria-label="다음 곡">⏭</button><button id="nowPlaying" aria-label="재생목록 열기"></button><span id="timeLabel">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="재생 위치"><button id="miniClose" aria-label="음악 정지 및 플레이어 닫기">✕</button></div><audio id="audio" preload="none"></audio>
<script src="tracks.js"></script><script src="characters.js"></script><script src="app.js"></script></body></html>
